name: CD

# 触发规则
on:
  pull_request:
    branches:
      - dev/1.0
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  RELEASE_TAG: release-${{ github.run_id }}

# 同一时间只允许一个生产部署，避免多个任务同时操作服务器。
concurrency:
  group: cd-dev-1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}

    # PR 合并后执行；手动触发时也执行。
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    # 每个矩阵实例各自跑在一个独立 runner 上 设置超时时间为 20 分钟
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 矩阵策略：并行构建 backend、frontend、postgres 任一失败不影响其他构建
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
          - postgres

    steps:
      # 无论触发源是什么分支，都固定拉 dev/1.0 分支的代码。
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0
      # 启用 BuildKit/Buildx，支持 cache-from / cache-to（GitHub Actions 缓存后端）以及多平台构建。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 构建并推送镜像
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # 构建上下文目录
          context: ${{ matrix.service == 'postgres' && './backend' || format('./{0}', matrix.service) }}
          # 用哪个 Dockerfile 构建镜像
          file: ${{ matrix.service == 'postgres' && './backend/Dockerfile.pg' || format('./{0}/Dockerfile', matrix.service) }}
          # 构建完直接推到仓库
          push: true
          # 镜像双标签 ：release-${{ github.run_id }} 和 dev-1.0
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:dev-1.0
          # `type=gha` 缓存到 GitHub Actions 自带的缓存服务 `scope=...` 防止覆盖其他服务的缓存
          cache-from: type=gha,scope=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          # `mode=min` 只缓存最近一次构建 ignore-error=true 缓存导出失败不算构建失败
          cache-to: type=gha,mode=min,scope=${{ env.IMAGE_PREFIX }}-${{ matrix.service }},ignore-error=true

  deploy:
    name: Deploy to server
    # 部署任务依赖 build 任务成功
    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      # 固定拉 dev/1.0 分支的代码。
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0

      # 同步部署配置文件到服务器
      - name: Sync deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}

          # 镜像里只有代码，没有"服务器的运行环境配置文件"，所以需要同步到服务器。
          # 配置文件里包含了环境变量、数据库连接信息、Redis 连接信息等。
          source: "docker-compose.prod.yml,nginx.conf"
          target: "${{ secrets.DEPLOY_PATH || '/opt/stockmate' }}"

      # 部署到服务器
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            # 严格模式：出错就停、未定义变量报错、管道任一环失败即失败
            set -Eeuo pipefail

            DEPLOY_PATH="/opt/stockmate"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "服务器缺少 $DEPLOY_PATH/.env，请先手动创建生产环境配置文件。"
              echo "可以基于仓库里的 .env.example 填写，但不要提交真实密钥。"
              exit 1
            fi

            # 部署镜像标签
            BACKEND_IMAGE="ghcr.io/${{ github.repository }}-backend:${{ env.RELEASE_TAG }}"
            FRONTEND_IMAGE="ghcr.io/${{ github.repository }}-frontend:${{ env.RELEASE_TAG }}"
            POSTGRES_IMAGE="ghcr.io/${{ github.repository }}-postgres:${{ env.RELEASE_TAG }}"

            # 只有文件所有者能读写，同机器上其他人读不了环境变量
            chmod 600 .env

            # 把`.env` 文件里某个变量的值改掉 。有就替换，没有就追加一行 这里目的是更新构建后的镜像标签 让compose拉取正确的镜像
            set_env_var() {
              KEY="$1"
              VALUE="$2"

              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                printf "\n%s=%s\n" "$KEY" "$VALUE" >> .env
              fi
            }

            set_env_var "BACKEND_IMAGE" "$BACKEND_IMAGE"
            set_env_var "FRONTEND_IMAGE" "$FRONTEND_IMAGE"
            set_env_var "POSTGRES_IMAGE" "$POSTGRES_IMAGE"

            # 给`docker compose` 这个长命令起个别名 ，以后只写`compose` 就行
            compose() {
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                "$@"
            }

            diagnostics() {
              EXIT_CODE=$?

              echo "部署失败，退出代码：${EXIT_CODE}"

              echo "输出容器状态..."
              compose ps || true

              echo "输出最近的容器日志..."
              compose logs --tail=150 || true

              docker logout ghcr.io >/dev/null 2>&1 || true
              exit "$EXIT_CODE"
            }

            # 只要有命令执行失败，就自动调用`diagnostics` 这个函数。
            trap diagnostics ERR

            echo "检查部署配置..."
            if ! compose config --quiet; then
              echo "docker-compose.prod.yml 配置无效，请检查重复字段或缩进"
              exit 1
            fi

            echo "登录 GitHub Container Registry..."
            echo "${{ github.token }}" |
              docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

            echo "拉取本次发布的镜像..."
            timeout 5m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull \
              backend \
              agent-worker \
              scheduler-worker \
              frontend \
              postgres \

            echo "启动基础设施容器（PostgreSQL + Redis）..."
            timeout 2m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d \
              postgres \
              redis

            echo "启动后端容器并执行数据库迁移..."
            timeout 3m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              run \
              --rm \
              backend \
              alembic upgrade head

            echo "更新业务服务..."
            timeout 3m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up \
              -d \
              --no-build \
              --remove-orphans \
              backend \
              agent-worker \
              scheduler-worker \
              frontend \
              nginx

            # 平滑重载
            echo "Restarting Nginx to refresh upstream container addresses..."
            compose exec -T nginx nginx -s reload

            echo "等待应用健康检查..."
            HEALTHY=0

            # --resolve 把域名指向本机：既走真实 HTTPS 链路，又真实校验证书（SNI=stockmate.top），
            # 证书过期/配错会直接失败，比 -k 跳过校验更能提前暴露问题。
            for i in $(seq 1 30); do
              if curl \
                -fsS \
                --resolve stockmate.top:443:127.0.0.1 \
                --max-time 5 \
                https://stockmate.top/health \
                >/dev/null; then
                HEALTHY=1
                break
              fi

              echo "健康检查尚未通过，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "应用健康检查失败——请检查上方的容器状态和日志输出"
              exit 1
            fi

            echo "清理未使用的旧镜像..."
            docker image prune -f || true

            echo "当前服务状态："
            compose ps

            docker logout ghcr.io || true

            trap - ERR
            echo "部署成功：${{ env.RELEASE_TAG }}"
