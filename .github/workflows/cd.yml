name: CD

# 触发规则
on:
  pull_request:
    branches:
      - dev/1.0
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  RELEASE_TAG: release-${{ github.run_id }}

# 同一时间只允许一个生产部署，避免多个任务同时操作服务器。
concurrency:
  group: cd-dev-1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}

    # PR 合并后执行；手动触发时也执行。
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    # 每个矩阵实例各自跑在一个独立 runner 上 设置超时时间为 20 分钟
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 矩阵策略：并行构建 backend、frontend、postgres 任一失败不影响其他构建
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
          - postgres

    steps:
      # 无论触发源是什么分支，都固定拉 dev/1.0 分支的代码。
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0
      # 启用 BuildKit/Buildx，支持 cache-from / cache-to（GitHub Actions 缓存后端）以及多平台构建。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 构建并推送镜像
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # 构建上下文目录
          context: ${{ matrix.service == 'postgres' && './backend' || format('./{0}', matrix.service) }}
          # 用哪个 Dockerfile 构建镜像
          file: ${{ matrix.service == 'postgres' && './backend/Dockerfile.pg' || format('./{0}/Dockerfile', matrix.service) }}
          # 构建完直接推到仓库
          push: true
          # 镜像双标签 ：release-${{ github.run_id }} 和 dev-1.0
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:dev-1.0
          # `type=gha` 缓存到 GitHub Actions 自带的缓存服务 `scope=...` 防止覆盖其他服务的缓存
          cache-from: type=gha,scope=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          # `mode=min` 只缓存最近一次构建 ignore-error=true 缓存导出失败不算构建失败
          cache-to: type=gha,mode=min,scope=${{ env.IMAGE_PREFIX }}-${{ matrix.service }},ignore-error=true

  deploy:
    name: Deploy to server
    # 部署任务依赖 build 任务成功
    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production

    steps:
      # 固定拉 dev/1.0 分支的代码。
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: dev/1.0

      # 同步部署配置文件到服务器
      - name: Sync deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}

          # 镜像里只有代码，没有"服务器的运行环境配置文件"，所以需要同步到服务器。
          # 配置文件里包含了环境变量、数据库连接信息、Redis 连接信息等。
          source: "docker-compose.prod.yml,nginx.conf"
          target: "${{ secrets.DEPLOY_PATH || '/opt/stockmate' }}"

      # 部署到服务器
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/stockmate"
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "服务器缺少 $DEPLOY_PATH/.env，请先手动创建生产环境配置文件。"
              echo "可以基于仓库里的 .env.example 填写，但不要提交真实密钥。"
              exit 1
            fi

            export BACKEND_IMAGE="ghcr.io/${{ github.repository }}-backend:${{ env.RELEASE_TAG }}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository }}-frontend:${{ env.RELEASE_TAG }}"
            export POSTGRES_IMAGE="ghcr.io/${{ github.repository }}-postgres:${{ env.RELEASE_TAG }}"

            chmod 600 .env

            set_env_var() {
              KEY="$1"
              VALUE="$2"

              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                printf "\n%s=%s\n" "$KEY" "$VALUE" >> .env
              fi
            }

            set_env_var "BACKEND_IMAGE" "$BACKEND_IMAGE"
            set_env_var "FRONTEND_IMAGE" "$FRONTEND_IMAGE"
            set_env_var "POSTGRES_IMAGE" "$POSTGRES_IMAGE"

            compose() {
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                "$@"
            }

            diagnostics() {
              EXIT_CODE=$?

              echo "部署失败，退出代码：${EXIT_CODE}"

              echo "输出 Compose 配置检查结果..."
              compose config --quiet || true

              echo "输出容器状态..."
              compose ps || true

              echo "输出最近的容器日志..."
              compose logs --tail=150 || true

              docker logout ghcr.io >/dev/null 2>&1 || true
              exit "$EXIT_CODE"
            }

            trap diagnostics ERR

            echo "检查 Docker Compose..."
            docker compose version

            echo "检查部署配置..."
            if ! compose config --quiet; then
              echo "docker-compose.prod.yml 配置无效，请检查重复字段或缩进"
              exit 1
            fi

            echo "登录 GitHub Container Registry..."
            echo "${{ github.token }}" |
              docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

            echo "拉取本次发布的镜像..."
            timeout 5m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull \
              backend \
              agent-worker \
              scheduler-worker \
              frontend \
              postgres

            # 第一步：确认 PostgreSQL 仍然可用，避免迁移打到不可用数据库。
            echo "检查 PostgreSQL 就绪状态..."
            POSTGRES_READY=0

            for i in $(seq 1 30); do
              if compose exec -T postgres sh -c \
                'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                >/dev/null 2>&1; then
                POSTGRES_READY=1
                break
              fi

              echo "PostgreSQL 尚未就绪，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$POSTGRES_READY" != "1" ]; then
              echo "PostgreSQL 未能在规定时间内就绪"
              exit 1
            fi

            # 第二步：使用一次性后端容器执行迁移。
            # 此时正式后端服务尚未启动，因此不会因为缺少数据表而启动失败。
            echo "执行数据库迁移..."
            timeout 3m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              run \
              --rm \
              --no-deps \
              backend \
              alembic upgrade head

            # 第三步：迁移成功后只更新业务服务。
            echo "更新业务服务..."
            timeout 3m docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up \
              -d \
              --no-build \
              --remove-orphans \
              backend \
              agent-worker \
              scheduler-worker \
              frontend \
              nginx

            echo "Restarting Nginx to refresh upstream container addresses..."
            compose restart nginx

            echo "等待后端容器运行..."
            BACKEND_READY=0

            for i in $(seq 1 30); do
              if [ -n "$(compose ps --status running -q backend)" ]; then
                BACKEND_READY=1
                break
              fi

              echo "后端尚未运行，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$BACKEND_READY" != "1" ]; then
              echo "后端容器未能正常运行"
              exit 1
            fi

            echo "等待应用健康检查..."
            HEALTHY=0

            for i in $(seq 1 30); do
              if curl \
                -fsS \
                --max-time 5 \
                http://localhost/health \
                >/dev/null; then
                HEALTHY=1
                break
              fi

              echo "健康检查尚未通过，等待 5 秒（${i}/30）..."
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "应用健康检查失败"
              exit 1
            fi

            echo "清理未使用的旧镜像..."
            docker image prune -f || true

            echo "当前服务状态："
            compose ps

            docker logout ghcr.io || true

            trap - ERR
            echo "部署成功：${{ env.RELEASE_TAG }}"
